name: IndexNow
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify published source and send one explicit batch
        run: |
          python scripts/seo.py --live
          python scripts/indexnow.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: indexnow-receipt
          path: /tmp/indexnow-receipt.json
