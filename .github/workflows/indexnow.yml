name: IndexNow

on:
  workflow_dispatch:
  push:
    branches: [gh-pages]
    paths:
      - "**/*.html"
      - "sitemap.xml"
      - "c4c0dc80b94f7dcc55c8791ba1277caf.txt"

permissions:
  contents: read

jobs:
  submit:
    name: Notify IndexNow
    runs-on: ubuntu-latest
    steps:
      - name: Submit sitemap URLs
        env:
          INDEXNOW_KEY: "c4c0dc80b94f7dcc55c8791ba1277caf"
          KEY_LOCATION: "https://oluwafemi1x.github.io/url-shortener/c4c0dc80b94f7dcc55c8791ba1277caf.txt"
          SITEMAP_URL: "https://oluwafemi1x.github.io/url-shortener/sitemap.xml"
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import xml.etree.ElementTree as ET

          key = os.environ["INDEXNOW_KEY"]
          key_location = os.environ["KEY_LOCATION"]
          sitemap_url = os.environ["SITEMAP_URL"]

          with urllib.request.urlopen(key_location, timeout=30) as response:
              body = response.read().decode("utf-8").strip()
              if body != key:
                  raise SystemExit("IndexNow key file does not match.")

          with urllib.request.urlopen(sitemap_url, timeout=30) as response:
              xml = response.read()

          root = ET.fromstring(xml)
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = [
              node.text.strip()
              for node in root.findall("sm:url/sm:loc", ns)
              if node.text and node.text.strip().startswith("https://oluwafemi1x.github.io/url-shortener/")
          ]

          if not urls:
              raise SystemExit("No IndexNow URLs found in sitemap.")

          payload = json.dumps({
              "host": "oluwafemi1x.github.io",
              "key": key,
              "keyLocation": key_location,
              "urlList": urls,
          }).encode("utf-8")

          request = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=payload,
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  status = response.status
                  print(f"IndexNow response: {status}; submitted URLs: {len(urls)}")
                  if status not in (200, 202):
                      raise SystemExit(f"Unexpected IndexNow response {status}")
          except urllib.error.HTTPError as exc:
              print(exc.read().decode("utf-8", "replace"))
              raise
          PY
