name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check tools.js

      - name: Check required frontend files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f tools.js
          test -f qr-code-generator/index.html
          test -f utm-builder/index.html
          test -f url-expander/index.html
          test -f link-tracker/index.html
          test -f sitemap.xml
          grep -q "shortenForm" index.html
          grep -q "https://pyc0.onrender.com" app.js
          grep -q "https://pyc0.onrender.com" tools.js
          grep -q "app.js?v=20260928-3" index.html
          ! grep -q "https://spoo.me/" app.js
          ! grep -q "https://cleanuri.com/" app.js

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Compile Python
        run: python -m compileall -q backend

      - name: Run API tests
        run: python -m unittest backend.test_app -v

  production-smoke:
    name: Production smoke test
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - name: Verify live backend and persistent storage
        run: |
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5             https://pyc0.onrender.com/health > /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          grep -q '"storage":"supabase"' /tmp/health.json
          grep -q '"analytics"' /tmp/health.json
          grep -q '"qr"' /tmp/health.json

      - name: Create and verify a real short link
        run: |
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5             -D /tmp/headers.txt             -H 'Origin: https://oluwafemi1x.github.io'             -H 'Content-Type: application/json'             -d '{"url":"https://github.com/Oluwafemi1x/url-shortener"}'             https://pyc0.onrender.com/api/shorten > /tmp/shorten.json

          grep -qi '^access-control-allow-origin: https://oluwafemi1x.github.io' /tmp/headers.txt

          SHORT_URL="$(python -c 'import json; print(json.load(open("/tmp/shorten.json"))["short_url"])')"
          CODE="$(python -c 'import json; print(json.load(open("/tmp/shorten.json"))["code"])')"
          test -n "$SHORT_URL"
          test "${#CODE}" -ge 5

          STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' "$SHORT_URL")"
          test "$STATUS" = "302"

          LOCATION="$(curl --silent --head "$SHORT_URL" | tr -d '\r' | awk 'BEGIN{IGNORECASE=1} /^Location:/{sub(/^Location:[[:space:]]*/,""); print; exit}')"
          case "$LOCATION" in
            https://github.com/Oluwafemi1x/url-shortener*) ;;
            *) echo "Unexpected redirect: $LOCATION"; exit 1 ;;
          esac

          echo "$CODE" > /tmp/code.txt

      - name: Verify analytics expansion and QR
        run: |
          CODE="$(cat /tmp/code.txt)"

          curl --fail --silent --show-error             "https://pyc0.onrender.com/api/analytics/$CODE" > /tmp/analytics.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/analytics.json"))
          assert data["link"]["code"]
          assert isinstance(data["link"]["clicks"], int)
          assert len(data["daily"]) == 30
          PY

          curl --fail --silent --show-error             -H 'Content-Type: application/json'             -d "{"short_url":"https://pyc0.onrender.com/$CODE"}"             https://pyc0.onrender.com/api/expand > /tmp/expand.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/expand.json"))
          assert data["original_url"].startswith("https://github.com/Oluwafemi1x/url-shortener")
          PY

          curl --fail --silent --show-error             -H 'Content-Type: application/json'             -d '{"url":"https://example.com/qr-test"}'             https://pyc0.onrender.com/api/qr > /tmp/qr.png
          python - <<'PY'
          data=open("/tmp/qr.png","rb").read(8)
          assert data == b"\x89PNG\r\n\x1a\n"
          PY

      - name: Verify Supabase persistence probe
        run: |
          STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' https://pyc0.onrender.com/PST01)"
          test "$STATUS" = "302"

          LOCATION="$(curl --silent --head https://pyc0.onrender.com/PST01 | tr -d '\r' | awk 'BEGIN{IGNORECASE=1} /^Location:/{sub(/^Location:[[:space:]]*/,""); print; exit}')"
          case "$LOCATION" in
            https://github.com/Oluwafemi1x/url-shortener*) ;;
            *) echo "Unexpected persistence redirect: $LOCATION"; exit 1 ;;
          esac

      - name: Verify GitHub Pages product pages
        run: |
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5             https://oluwafemi1x.github.io/url-shortener/ > /tmp/index.html
          grep -q 'app.js?v=20260928-3' /tmp/index.html

          curl --fail --silent --show-error             'https://oluwafemi1x.github.io/url-shortener/app.js?v=20260928-3' > /tmp/app.js
          grep -q 'https://pyc0.onrender.com' /tmp/app.js
          ! grep -q 'https://spoo.me/' /tmp/app.js
          ! grep -q 'https://cleanuri.com/' /tmp/app.js

          for PAGE in qr-code-generator utm-builder url-expander link-tracker; do
            curl --fail --silent --show-error               "https://oluwafemi1x.github.io/url-shortener/$PAGE/" > "/tmp/$PAGE.html"
            grep -qi '<title>' "/tmp/$PAGE.html"
          done
